spring.application.name=viacao-calango-api

# Banco em mem?ria para desenvolvimento (troque por PostgreSQL em produ??o)
spring.datasource.url=jdbc:h2:mem:calango;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Precifica??o
calango.precificacao.desconto-trajeto-completo=0.15
calango.precificacao.fator-leito=1.5
calango.precificacao.fator-semi-leito=1.2
calango.precificacao.fator-executivo=1.0
calango.precificacao.faixas-antecedencia[0].dias-minimos=30
calango.precificacao.faixas-antecedencia[0].desconto=0.20
calango.precificacao.faixas-antecedencia[1].dias-minimos=15
calango.precificacao.faixas-antecedencia[1].desconto=0.10
calango.precificacao.faixas-antecedencia[2].dias-minimos=7
calango.precificacao.faixas-antecedencia[2].desconto=0.05

# Velocidade m?dia para estimativa de tempo de trecho (km/h)
calango.operacao.velocidade-media-kmh=80

# Springdoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
