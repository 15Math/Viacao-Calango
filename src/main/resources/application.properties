spring.datasource.url=jdbc:postgresql://localhost:5432/viacao_calango
spring.datasource.username=postgres
spring.datasource.password=senha123

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Força a execução do script data.sql mesmo em bancos externos
spring.sql.init.mode=always
# Garante que o Hibernate termine de criar as tabelas antes do script rodar
spring.jpa.defer-datasource-initialization=true
# Mostra no log se o script foi lido (ajuda a diagnosticar)
logging.level.org.springframework.jdbc.datasource.init=DEBUG


calango.precificacao.dias-antecedencia=30
calango.precificacao.desconto-antecedencia=0.15
calango.precificacao.desconto-trajeto-completo=0.10
calango.precificacao.fator-leito=1.5
calango.precificacao.fator-semi-leito=1.25
calango.precificacao.fator-executivo=1.10

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html